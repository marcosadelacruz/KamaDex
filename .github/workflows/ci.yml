name: Validar KamaDex
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/app.js
      - run: node --check src/catalog.js
      - run: node tests/validate.mjs
      - run: python -m py_compile tools/download_images.py
